name: Update market data

on:
  schedule:
    # Weekdays. DMO prices land in the evening; BoE curves for a day appear by the next
    # working day, so the morning and midday runs pick those up. The 22:15 run catches the
    # day's gilt closes if they weren't published by the 19:15 run.
    - cron: "15 7,13,19,22 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also download ~3 years of curve history (slow)"
        type: boolean
        default: false
      gilt_days:
        description: "Backfill this many business days of per-gilt closes from giltsyield.com (~75 API calls per day)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the pre-push rebase always works
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch data
        env:
          # Optional: lets the job record giltsyield.com closes for every gilt.
          GILTSYIELD_API_KEY: ${{ secrets.GILTSYIELD_API_KEY }}
        run: npm run fetch-data -- ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.gilt_days > 0 && format('--gilt-days={0}', inputs.gilt_days) || '' }}
      - name: Commit if changed
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "gilt-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Code may have been pushed while this job ran (a backfill can take a while).
          # This job only touches data/, so rebasing onto the latest main is safe.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          exit 1
